name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Find and build with Gradle
      run: |
        GRADLE_PATH=$(find . -name "gradlew" -type f)
        if [ -z "$GRADLE_PATH" ]; then
          echo "Error: gradlew not found!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLE_PATH")
        echo "Found gradlew at $PROJECT_DIR"
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'

