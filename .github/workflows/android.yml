name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate Gradle Wrapper and Build
      run: |
        GRADLE_W=$(find . -name "gradlew" -type f | head -n 1)
        
        if [ -z "$GRADLE_W" ]; then
          echo "gradlew não encontrado. A gerar com gradle wrapper..."
          SETTINGS_FILE=$(find . -name "settings.gradle*" -type f | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$PROJECT_DIR"
          gradle wrapper
        else
          PROJECT_DIR=$(dirname "$GRADLE_W")
          cd "$PROJECT_DIR"
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'

